# Production-style stack: Postgres + API + web (nginx proxying /api to the API).
# Copy .env.example to .env and set at least JWT_SECRET and POSTGRES_PASSWORD before `docker compose up -d`.
name: hirewithsense

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hws}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-hirewithsense}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-hws} -d ${POSTGRES_DB:-hirewithsense}']
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-hws}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hirewithsense}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:8080}
      CLIENT_ORIGINS: ${PUBLIC_WEB_URL:-http://localhost:8080}
      TRUST_PROXY: 'true'
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4.1-mini}
      AI_ENABLE_AUDIO: ${AI_ENABLE_AUDIO:-false}
      # Speech (voice interviews). 'openai_compatible' with SPEECH_BASE_URL pointing at the bundled
      # Speaches service (profile `speech`) gives free self-hosted transcription + text-to-speech;
      # leave SPEECH_BASE_URL empty to use OpenAI's audio models with SPEECH_API_KEY.
      SPEECH_PROVIDER: ${SPEECH_PROVIDER:-none}
      SPEECH_BASE_URL: ${SPEECH_BASE_URL:-}
      SPEECH_API_KEY: ${SPEECH_API_KEY:-}
      SPEECH_STT_MODEL: ${SPEECH_STT_MODEL:-gpt-4o-mini-transcribe}
      SPEECH_TTS_MODEL: ${SPEECH_TTS_MODEL:-gpt-4o-mini-tts}
      SPEECH_TTS_VOICE: ${SPEECH_TTS_VOICE:-coral}
      SPEECH_TTS_FORMAT: ${SPEECH_TTS_FORMAT:-mp3}
      # Code execution: 'judge0' (recommended for hosted deployments) or 'docker' (requires mounting the
      # host Docker socket, see the `docker-runner` profile below).
      CODE_RUNNER: ${CODE_RUNNER:-judge0}
      JUDGE0_URL: ${JUDGE0_URL:-}
      JUDGE0_API_KEY: ${JUDGE0_API_KEY:-}
      JUDGE0_API_HOST: ${JUDGE0_API_HOST:-}
      JUDGE0_AUTH_TOKEN: ${JUDGE0_AUTH_TOKEN:-}
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-outbox}
      EMAIL_FROM: ${EMAIL_FROM:-HireWithSense <no-reply@example.com>}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      UPLOAD_DIR: /app/apps/api/uploads
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      SUPERADMIN_EMAILS: ${SUPERADMIN_EMAILS:-}
    volumes:
      - uploads:/app/apps/api/uploads
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:4000/health/ready || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '${WEB_PORT:-8080}:80'

  # Optional self-hosted speech engine (faster-whisper + Kokoro) behind the OpenAI audio API.
  # Start with:  docker compose --profile speech up -d
  # then install the models once:  ./scripts/speech-models.sh http://localhost:8000
  # (or `docker compose exec api wget -qO- --post-data= http://speaches:8000/v1/models/<id>`)
  # and set in .env:
  #   SPEECH_PROVIDER=openai_compatible
  #   SPEECH_BASE_URL=http://speaches:8000/v1
  #   SPEECH_STT_MODEL=Systran/faster-whisper-small
  #   SPEECH_TTS_MODEL=speaches-ai/Kokoro-82M-v1.0-ONNX
  #   SPEECH_TTS_VOICE=af_heart
  speaches:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    profiles: ['speech']
    restart: unless-stopped
    ports:
      - '${SPEECH_PORT:-8000}:8000'
    environment:
      ENABLE_UI: 'false'
      WHISPER__COMPUTE_TYPE: int8
    volumes:
      - hf-hub-cache:/home/ubuntu/.cache/huggingface/hub
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:8000/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

volumes:
  pgdata:
  uploads:
  hf-hub-cache:
